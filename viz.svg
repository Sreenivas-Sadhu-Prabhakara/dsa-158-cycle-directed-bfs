<text x="56.0" y="457.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Rule: processed &lt; n ⟺ cycle. The diamond DAG (0→1→3, 0→2→3) peels all 4 → no cycle.</text>
